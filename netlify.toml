[build]
  command = "npm run build"
  publish = "dist"

# Caching: images and fonts change rarely; HTML is always revalidated.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/og/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Redirect the bare domain to www (also set www as primary domain in Netlify).
[[redirects]]
  from = "https://rescatedesdeturquia.com/*"
  to = "https://www.rescatedesdeturquia.com/:splat"
  status = 301
  force = true
